# 컴파일과 검사. PR 마다 돈다.
#
# ## 갈래가 하나로 줄어든 이유
#
# 코어와 카탈로그는 npm 에 `borch-ts`·`bimm-ts` 로 있다. 타입도 값도 거기서 오므로
# `npm ci` 한 번이면 **배포되는 코드 전부**가 토큰 없이 검사된다.
#
# 전에는 두 갈래였다. 코어가 npm 에 없어서 러너가 옆에 받아둘 수 없었고, 토큰이 없으면
# 코어를 쓰는 파일을 통째로 건너뛰었다 — `src/load.ts` 와 `src/verify.ts` 가 거기
# 있었다. 그래서 코어가 API 를 바꾼 8/21 부터 나흘 동안 **이 저장소는 컴파일되지 않는
# 상태로 초록이었다.** 그 갈래는 그날의 사정이었고 사정이 끝나서 사라졌다.
#
# ## 남은 하나 — 브라우저 하네스
#
# `browser/parity.ts` 와 `train.ts` 는 코어의 벤치 모듈을 쓴다. 공개 진입점이 아니라
# npm 배포에 안 실리고, 저장소는 아직 private 이라 러너가 그냥 못 받는다. 토큰이 있으면
# 받아서 그것까지 보고, 없으면 **경고를 남긴다** — 말없이 건너뛰면 초록색이 "다 봤다"로
# 읽히는데, 안 본 것이 있으면 그건 거짓말이다.
#
# 토큰 이름: CORE_REPO_TOKEN (playidea-lab/borch 읽기 권한).
name: 검사

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # secrets 는 step 의 if 에서 못 읽는다(워크플로가 아예 안 뜬다 — 실측).
    # env 로 한 번 옮기면 읽을 수 있다.
    env:
      CORE_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # 배포되는 코드 전부. 토큰과 무관하게 언제나 돈다.
      - name: 검사
        run: npm test

      - name: 코어 받기 (브라우저 하네스용)
        id: core
        if: env.CORE_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: playidea-lab/borch
          token: ${{ env.CORE_TOKEN }}
          path: core-checkout

      # tsconfig.browser.json 의 paths 가 `../borch` 를 본다. 러너의 작업 디렉터리
      # 옆으로 옮기면 로컬에서 나란히 받아둔 것과 같은 배치가 된다.
      - name: 코어 빌드
        if: steps.core.outcome == 'success'
        run: |
          mv core-checkout ../borch
          cd ../borch && npm ci && npm run build:ts

      - name: 검사 (브라우저 하네스)
        if: steps.core.outcome == 'success'
        run: npm run check:browser

      - name: 하네스를 못 본 이유
        if: steps.core.outcome != 'success'
        run: echo "::warning::CORE_REPO_TOKEN 이 없어 브라우저 하네스(parity·train)를 검사하지 못했다. 배포되는 코드는 전부 확인됨."
