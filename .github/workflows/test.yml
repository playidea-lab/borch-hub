# 컴파일과 검사. PR 마다 돈다.
#
# ## 갈래가 없다
#
# 코어·카탈로그가 npm 에 있고, **하네스가 쓰는 벤치 모듈까지 거기 실린다**
# (`borch-ts` 0.2.2 의 `dist/test/bench`·`accuracy`). 그래서 `npm ci` 한 번이면
# 이 저장소의 **모든 것**이 토큰 없이 검사된다.
#
# 전에는 두 갈래였다. 토큰이 있으면 코어를 받아 더 보고, 없으면 못 본 것을 경고로
# 남겼다. 그 토큰은 **한 번도 설정된 적이 없다.** 그래서 코어가 API 를 바꾼 8/21 부터
# 나흘 동안 `src/load.ts` 와 `src/verify.ts` 가 컴파일되지 않는 채로 초록이었다.
#
# 갈래를 하나씩 줄이는 데 두 번이 걸렸다 — 배포되는 코드가 먼저(코어가 npm 에 나가면서),
# 브라우저 하네스가 나중(벤치가 tarball 에 실리면서). **"토큰이 있으면 더 본다"는 말이
# 이 저장소에서 사라졌다.** 초록은 이제 다 봤다는 뜻이다.

name: 검사

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # 배포되는 코드 전부. 토큰과 무관하게 언제나 돈다.
      - name: 검사
        run: npm test

      # **검사가 무엇을 잡는지 검사한다.** 고친 결함을 도로 심어, 잡히는지 그리고
      # 잡은 것이 그 검사인지까지 본다. 초록이 "다 봤다" 로 읽히려면 이것이 필요하다 —
      # 이 저장소가 나흘 동안 깨진 채로 초록이었던 적이 있다.
      - name: 검사가 결함을 잡는가
        run: npm run reinstate

      - name: 검사 (브라우저 하네스)
        run: npm run check:browser
