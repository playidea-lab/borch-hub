<!doctype html>
<!-- 만든 화물을 다시 받아 되싣고 대조한다. 러너가 띄운다. -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>borch-hub — 왕복</title>
  <style>
    body { font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 2rem; }
    pre { white-space: pre-wrap; }
  </style>
  <script type="importmap">
  { "imports": {
      "borch-ts": "/borch-hub/node_modules/borch-ts/borch-ts/dist/src/index.js",
      "bimm-ts": "/borch-hub/node_modules/bimm-ts/dist/src/index.js"
  } }
  </script>
</head>
<body>
  <h1>borch-hub — 왕복</h1>
  <pre id="out">받는 중…</pre>
  <script type="module">
    import { report, VERDICT } from "/borch-hub/dist/browser/roundtrip.js";

    const out = document.getElementById("out");
    const manifest = new URLSearchParams(location.search).get("manifest");
    try {
      if (!manifest) throw new Error("manifest 주소가 없다");
      const result = await report(manifest);
      window.__borchHubRoundtrip = result;
      out.textContent = result.text;
    } catch (err) {
      const detail = err && err.stack ? err.stack : String(err);
      const failed = { ok: false, text: `왕복하지 못했다: ${detail}` };
      window.__borchHubRoundtrip = failed;
      out.textContent = failed.text;
      // **실패도 판정이다.** 기다리는 쪽은 이 줄 하나만 본다. 성공할 때만
      // 내보내면 던진 검사는 아무 말 없이 시간 한도를 채우고, 그러면 "고장" 과
      // "잡았다" 가 화면에서 같은 모양이 된다 — 실제로 그렇게 만들어 놓고
      // 일부러 부수어 보고서야 알았다.
      console.log(`${VERDICT}${JSON.stringify(failed)}`);
    }
  </script>
</body>
</html>
